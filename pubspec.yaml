name: valquin
description: "A mobile fitness RPG that turns real-world training into character progression."
publish_to: 'none'

version: 0.6.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  flutter_launcher_icons: 0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/launcher.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
